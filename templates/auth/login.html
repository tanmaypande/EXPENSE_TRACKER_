<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log in - ShopLedger</title>
  
  <script>
    (function() {
      const saved = localStorage.getItem('theme');
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.setAttribute('data-theme', saved || (prefersDark ? 'dark' : 'light'));
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="{{ url_for('static', filename='fintech.css') }}">
</head>
<body class="auth-page">

  <div class="auth-nav-top">
    <button class="theme-toggle-btn" title="Toggle theme">
      <i data-lucide="sun" style="width: 17px; height: 17px;"></i>
    </button>
  </div>

  <div class="auth-card">
    <div class="auth-brand">
      <div class="auth-brand-logo">
        <i data-lucide="store" style="width: 22px; height: 22px;"></i>
      </div>
      <h1 class="auth-title">ShopLedger</h1>
      <p class="auth-subtitle">Sign in to your shop management portal</p>
    </div>

    {% if error %}
      <div class="auth-alert error">
        <i data-lucide="alert-circle" style="width: 16px; height: 16px; flex-shrink: 0;"></i>
        <span>{{ error }}</span>
      </div>
    {% endif %}

    <form action="{{ url_for('auth.login') }}" method="POST" class="auth-form">
      <div class="form-group">
        <label class="form-label">Email</label>
        <div class="auth-input-wrapper">
          <i data-lucide="mail" class="auth-input-icon"></i>
          <input type="email" name="email" class="auth-input" placeholder="owner@myshop.com" required autofocus>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Password</label>
        <div class="auth-input-wrapper">
          <i data-lucide="lock" class="auth-input-icon"></i>
          <input type="password" name="password" id="login-password-field" class="auth-input" placeholder="Your password" required>
          <button type="button" class="password-toggle-btn" id="toggle-password-btn" title="Toggle visibility">
            <i data-lucide="eye" id="password-eye-icon" style="width: 16px; height: 16px;"></i>
          </button>
        </div>
      </div>

      <button type="submit" class="auth-btn-submit">
        Log in to Dashboard
      </button>
    </form>

    <div class="auth-footer">
      <span>Don't have a shop account?</span>
      <a href="{{ url_for('auth.signup') }}" class="auth-link">Register shop</a>
    </div>
  </div>

  <script src="{{ url_for('static', filename='script.js') }}"></script>
  <script>
    const toggleBtn = document.getElementById("toggle-password-btn");
    const passwordField = document.getElementById("login-password-field");
    const eyeIcon = document.getElementById("password-eye-icon");

    if (toggleBtn && passwordField) {
      toggleBtn.addEventListener("click", () => {
        const isPassword = passwordField.type === "password";
        passwordField.type = isPassword ? "text" : "password";
        if (eyeIcon) {
          eyeIcon.setAttribute("data-lucide", isPassword ? "eye-off" : "eye");
          if (window.lucide) window.lucide.createIcons();
        }
      });
    }
  </script>
</body>
</html>
