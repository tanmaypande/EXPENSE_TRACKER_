<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Setup Your Shop - ShopLedger</title>
  
  <script>
    (function() {
      const saved = localStorage.getItem('theme');
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.setAttribute('data-theme', saved || (prefersDark ? 'dark' : 'light'));
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="{{ url_for('static', filename='fintech.css') }}">
</head>
<body class="auth-page">

  <div class="auth-nav-top">
    <button class="theme-toggle-btn" title="Toggle theme">
      <i data-lucide="sun" style="width: 17px; height: 17px;"></i>
    </button>
  </div>

  <div class="auth-card" style="max-width: 500px; padding: 32px 28px;">
    <div class="auth-brand" style="margin-bottom: 20px;">
      <div class="auth-brand-logo">
        <i data-lucide="store" style="width: 24px; height: 24px;"></i>
      </div>
      <h1 class="auth-title">Shop Setup Wizard</h1>
      <p class="auth-subtitle">Configure your business details to start billing and inventory tracking</p>
    </div>

    {% if error %}
      <div class="auth-alert error">
        <i data-lucide="alert-circle" style="width: 16px; height: 16px; flex-shrink: 0;"></i>
        <span>{{ error }}</span>
      </div>
    {% endif %}

    <form action="{{ url_for('auth.onboarding') }}" method="POST" class="auth-form">
      
      <!-- Store Name -->
      <div class="form-group">
        <label class="form-label">Shop / Store Name *</label>
        <div class="auth-input-wrapper">
          <i data-lucide="building-2" class="auth-input-icon"></i>
          <input type="text" name="business_name" class="auth-input" placeholder="e.g. Shree Ganesh Kirana Store" required autofocus>
        </div>
      </div>

      <!-- Business Category -->
      <div class="form-group">
        <label class="form-label">Business Category *</label>
        <select name="category" class="filter-select" style="width: 100%; height: 42px; font-size: 0.88rem;" required>
          <option value="kirana">Grocery & Kirana Store</option>
          <option value="clothing">Clothing & Apparel Store</option>
          <option value="electronics">Electronics & Mobile Shop</option>
          <option value="medical">Pharmacy & Medical Store</option>
          <option value="restaurant">Restaurant, Cafe & Bakery</option>
          <option value="retail">General Retail</option>
          <option value="wholesale">Wholesale & Distribution</option>
        </select>
        <span style="font-size: 0.72rem; color: var(--text-faint); margin-top: 3px;">
          Automatically populates starter products matching your store type.
        </span>
      </div>

      <!-- Contact Phone & Address -->
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Contact Phone</label>
          <input type="tel" name="phone" class="form-input" placeholder="+91 98765 43210">
        </div>
        <div class="form-group">
          <label class="form-label">GSTIN (Optional)</label>
          <input type="text" name="gstin" class="form-input" placeholder="22AAAAA0000A1Z5" style="text-transform: uppercase;">
        </div>
      </div>

      <!-- Address -->
      <div class="form-group">
        <label class="form-label">Shop Address</label>
        <input type="text" name="address" class="form-input" placeholder="Shop No., Market, City">
      </div>

      <!-- Invoice Prefix & Default Tax -->
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Invoice Prefix</label>
          <input type="text" name="invoice_prefix" class="form-input" value="INV-" placeholder="INV-">
        </div>
        <div class="form-group">
          <label class="form-label">Default GST Rate (%)</label>
          <select name="default_tax_rate" class="filter-select" style="width: 100%; height: 40px;">
            <option value="0">0% (Exempt)</option>
            <option value="5">5% GST</option>
            <option value="12">12% GST</option>
            <option value="18">18% GST</option>
            <option value="28">28% GST</option>
          </select>
        </div>
      </div>

      <input type="hidden" name="currency" value="₹">
      <input type="hidden" name="tax_enabled" value="1">

      <button type="submit" class="auth-btn-submit" style="margin-top: 10px;">
        Complete Setup & Open Store
      </button>

    </form>
  </div>

  <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
