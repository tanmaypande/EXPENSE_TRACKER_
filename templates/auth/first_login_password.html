<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Set Your Password - ShopLedger</title>
  
  <script>
    document.documentElement.setAttribute('data-theme', 'light');
    localStorage.setItem('theme', 'light');
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="{{ url_for('static', filename='fintech.css') }}">
</head>
<body class="auth-page">

  <div class="auth-card" style="max-width: 440px;">
    <div class="auth-brand">
      <div class="auth-brand-logo" style="background: rgba(37, 99, 235, 0.1); color: #2563EB;">
        <i data-lucide="shield-check" style="width: 24px; height: 24px;"></i>
      </div>
      <h1 class="auth-title">Welcome to ShopLedger</h1>
      <p class="auth-subtitle">Your shop owner account is activated. Please set your own secure password to continue.</p>
    </div>

    {% if error %}
      <div class="auth-alert error">
        <i data-lucide="alert-circle" style="width: 16px; height: 16px; flex-shrink: 0;"></i>
        <span>{{ error }}</span>
      </div>
    {% endif %}

    <form method="POST" action="{{ url_for('auth.first_login_password') }}" class="auth-form">
      <div class="form-group">
        <label class="form-label" for="new_password">New Password (Min 6 characters)</label>
        <div class="auth-input-wrapper">
          <i data-lucide="lock" class="auth-input-icon"></i>
          <input type="password" id="new_password" name="new_password" class="auth-input" placeholder="Create your new password" required autofocus>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="confirm_password">Confirm New Password</label>
        <div class="auth-input-wrapper">
          <i data-lucide="check" class="auth-input-icon"></i>
          <input type="password" id="confirm_password" name="confirm_password" class="auth-input" placeholder="Re-type new password" required>
        </div>
      </div>

      <button type="submit" class="auth-btn-submit" style="background: #2563EB;">
        Save Password & Open Dashboard
      </button>

      <div style="text-align: center; margin-top: 14px;">
        <a href="{{ url_for('auth.logout') }}" style="font-size: 0.8rem; color: var(--text-muted); text-decoration: none;">
          Sign out and return later
        </a>
      </div>
    </form>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      if (window.lucide) lucide.createIcons();
    });
  </script>
</body>
</html>
