<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign up - Expense Tracker</title>
  
  <script>
    document.documentElement.setAttribute('data-theme', 'light');
    localStorage.setItem('theme', 'light');
  </script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Stylesheet -->
  <link rel="stylesheet" href="{{ url_for('static', filename='fintech.css') }}">
</head>
<body class="auth-page">

  <div class="auth-card">
    <div class="auth-brand">
      <div class="auth-brand-logo">
        <i data-lucide="wallet-cards" style="width: 22px; height: 22px;"></i>
      </div>
      <h1 class="auth-title">Create an account</h1>
      <p class="auth-subtitle">Track your expenses, income, and monthly budget</p>
    </div>

    {% if error %}
      <div class="auth-alert error">
        <i data-lucide="alert-circle" style="width: 16px; height: 16px; flex-shrink: 0;"></i>
        <span>{{ error }}</span>
      </div>
    {% endif %}

    <form action="{{ url_for('signup') }}" method="POST" class="auth-form">
      <div class="form-group">
        <label class="form-label">Email</label>
        <div class="auth-input-wrapper">
          <i data-lucide="mail" class="auth-input-icon"></i>
          <input type="email" name="email" class="auth-input" placeholder="you@example.com" required autofocus>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Password</label>
        <div class="auth-input-wrapper">
          <i data-lucide="lock" class="auth-input-icon"></i>
          <input type="password" name="password" id="signup-password-field" class="auth-input" placeholder="At least 6 characters" required minlength="6">
          <button type="button" class="password-toggle-btn" id="toggle-password-btn" title="Toggle visibility">
            <i data-lucide="eye" id="password-eye-icon" style="width: 16px; height: 16px;"></i>
          </button>
        </div>
      </div>

      <button type="submit" class="auth-btn-submit">
        Create account
      </button>
    </form>

    <div class="auth-footer">
      <span>Already have an account?</span>
      <a href="{{ url_for('login') }}" class="auth-link">Log in</a>
    </div>
  </div>

  <script src="{{ url_for('static', filename='script.js') }}"></script>
  <script>
    const toggleBtn = document.getElementById("toggle-password-btn");
    const passwordField = document.getElementById("signup-password-field");
    const eyeIcon = document.getElementById("password-eye-icon");

    if (toggleBtn && passwordField) {
      toggleBtn.addEventListener("click", () => {
        const isPassword = passwordField.type === "password";
        passwordField.type = isPassword ? "text" : "password";
        if (eyeIcon) {
          eyeIcon.setAttribute("data-lucide", isPassword ? "eye-off" : "eye");
          if (window.lucide) window.lucide.createIcons();
        }
      });
    }
  </script>
</body>
</html>
